<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>星球画风样板 · 月球 / 金星</title>
  <style>
    html, body { margin: 0; height: 100%; background: #05070f; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <script type="module">
    import { drawPlanet } from '/js/planet-fx.js';
    import { DESTINATIONS as PLANETS } from '/js/destinations.js';
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const dpr = Math.min(2, window.devicePixelRatio || 1);

    // 固定星野（种子稳定）
    let seed = 1234567;
    const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
    const stars = Array.from({ length: 160 }, () => ({ x: rnd(), y: rnd(), r: rnd() * 1.5 + 0.3, a: rnd() * 0.6 + 0.25 }));

    function render() {
      const W = window.innerWidth, H = window.innerHeight;
      canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
      canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      // 深空背景
      const bg = ctx.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, '#070b18'); bg.addColorStop(1, '#04060e');
      ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
      for (const s of stars) {
        ctx.globalAlpha = s.a; ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;

      const r = Math.min(W * 0.30, H * 0.165);
      const items = [
        { id: 'moon', cy: H * 0.28 },
        { id: 'venus', cy: H * 0.72 },
      ];
      for (const it of items) {
        const cx = W * 0.5;
        drawPlanet(ctx, it.id, cx, it.cy, r, 0, { rot: 0.35 });
        const meta = PLANETS[it.id];
        ctx.textAlign = 'center';
        ctx.fillStyle = '#eaf2ff';
        ctx.font = `bold ${Math.round(H * 0.032)}px sans-serif`;
        ctx.fillText(`${meta.name} · ${meta.nameEn}`, cx, it.cy + r + H * 0.05);
        ctx.fillStyle = '#8fa3c8';
        ctx.font = `${Math.round(H * 0.02)}px sans-serif`;
        ctx.fillText(`Lv${meta.level} 目的地样板（代码绘制）`, cx, it.cy + r + H * 0.082);
      }
      window.__ready = true;
    }
    render();
    window.addEventListener('resize', render);
    window.__render = render;
  </script>
</body>
</html>
